name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        # Single-entry matrix on purpose: production runs 8.5, so that is all CI tests.
        # Add 8.6 here when it reaches RC. Do not re-add 8.4 (nothing runs it).
        php: ['8.5']
        stability: [prefer-stable]

    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}

    services:
      soketi:
        image: quay.io/soketi/soketi:1.6-16-debian
        ports:
          - 6001:6001
        env:
          SOKETI_DEBUG: '1'
          SOKETI_DEFAULT_APP_ID: app-id
          SOKETI_DEFAULT_APP_KEY: app-key
          SOKETI_DEFAULT_APP_SECRET: app-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Wait for Soketi
        run: |
          for i in {1..30}; do
            if nc -z localhost 6001; then
              echo "Soketi is ready"
              exit 0
            fi
            echo "Waiting for Soketi..."
            sleep 1
          done
          echo "Soketi did not start in time"
          exit 1

      - name: Execute tests
        run: vendor/bin/pest --ci
        env:
          PUSHER_HOST: 127.0.0.1
          PUSHER_PORT: 6001
          PUSHER_APP_ID: app-id
          PUSHER_APP_KEY: app-key
          PUSHER_APP_SECRET: app-secret
          PUSHER_SCHEME: ws
